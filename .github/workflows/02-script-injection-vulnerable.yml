# INTENTIONALLY VULNERABLE: training only.
name: "Lab 02 - Script injection (VULNERABLE)"

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  vulnerable-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print PR title
        run: |
          echo "Title: ${{ github.event.pull_request.title }}"
